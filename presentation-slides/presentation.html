      # Benefits of Large Language Models

      - Multi-task Capability

        - LLMs find applications in content generation, question answering, translation, tutoring, and personal assistants.

      --

      - Fine-tuning
        - LLMs can usually be fine tuned with a relatively small amount of data, making them adaptable to a wide range of tasks.

      --

      - Scalability

        - LLMs demonstrate excellent scalability to very large capacity networks and huge datasets.

      ---

      # Limitations and Ethical Considerations

      ## LLMs are far from perfect

      --

      - __Knowledge Limit__: LLMs have a cutoff point for their knowledge.

      --

      - __Understanding Limit__: LLMs do not understand text in the same way humans do. They don't have beliefs or desires; they simply predict what comes next based on their training.

      --

      - __Misuse__: LLMs can hallucinate and produce false or harmful content

      --

      - __Reproducibility__: Unpredictability of LLM behavior. Watkins 2023

      --

      - __Data Privacy and Bias__: Ethical considerations should extend to the acquisition of data for training additional models. Models may have biases; their use should be transparent and biases mitigated. Watkins 2023

      # Q&A & Summary

      - __LLMs predict the next word__ and generate human-like text.

      - __LLMs power diverse applications__ including conversational chatbots, search engines, and translation services, demonstrating their versatility in handling various language tasks.

      - __Transformer architecture__ processes text in parallel, utilizing mechanisms like tokenization, embedding, positional encoding, and attention to understand context and generate relevant outputs.

      - __Advantages of LLMs__: LLMs are multi-taskers capable of content generation, question answering, and more, with the ability to be fine-tuned for specific tasks and scale effectively to handle large datasets and complex models.

      - __Benefits and Limitations__: Despite their benefits (multi-tasking, fine-tuning etc..), LLMs have limitations, including a fixed knowledge base, lack of true understanding, potential for misuse, and ethical concerns around data privacy and inherent biases.

      # OpenAI .accent[Responses API]

      ### The single API for models + tools + state

      ---

      # Introduction to the OpenAI Responses API

      - The __Responses API__ is OpenAI's core API: one endpoint for text generation, reasoning, hosted tools, and multi-turn state.

      --

      - Basic structure of calling the API:

      ```python
        from openai import OpenAI
        client = OpenAI()

        def get_response(prompt_question):
            response = client.responses.create(
                model="gpt-5.4-mini",
                instructions="You are a helpful research and programming assistant",
                input=prompt_question,
            )
            return response.output_text
      ```

      --

      - Required parameters: `model`, `input`

      --

      - `instructions` replaces the old system message; `response.output_text` gives you the answer directly.

      <p class="footnote">
        <sup>[2]</sup><a href="https://platform.openai.com/docs/api-reference/responses">OpenAI Docs - Responses API</a>
      </p>

      ---

      # Responses vs. Chat Completions

      .pull-left[
      <span class="label-old">Chat Completions (legacy)</span>

      ```python
      completion = client.chat.completions.create(
          model="gpt-5.4-mini",
          messages=[
            {"role": "system",
             "content": "You are helpful."},
            {"role": "user",
             "content": "Hi!"},
          ],
      )

      print(completion.choices[0]
            .message.content)
      ```
      ]

      .pull-right[
      <span class="label-new">Responses (current)</span>

      ```python
      response = client.responses.create(
          model="gpt-5.4-mini",
          instructions="You are helpful.",
          input="Hi!",
      )

      print(response.output_text)

      # multi-turn without resending
      # the whole transcript:
      client.responses.create(
          model="gpt-5.4-mini",
          previous_response_id=response.id,
          input="Tell me more!")
      ```
      ]

      <br style="clear: both;"/>

      - OpenAI reports a __40–80% improvement in cache utilization__ vs Chat Completions in internal tests → lower latency and cost.

      <p class="footnote">
        <sup>[3]</sup><a href="https://platform.openai.com/docs/guides/migrate-to-responses">Migrate to the Responses API</a>
      </p>

      # The 2026 Model Lineup

      | Model | One-line use case |
      |---|---|
      | `gpt-5.5` | Flagship: hardest coding, agentic, and professional work |
      | `gpt-5.5-pro` | Maximum reasoning depth for the toughest problems (defaults to high effort) |
      | `gpt-5.4` | Affordable previous-gen workhorse for coding & professional work |
      | `gpt-5.4-mini` | Fast + cheap: coding, computer use, and subagents |
      | `gpt-5.4-nano` | Ultra-low latency/cost: classification, autocomplete, simple extraction |

      --

      > In this course we'll use __`gpt-5.4-mini`__ for most examples — best price/performance for learning and prototyping.

      <p class="footnote">
        <sup>[4]</sup><a href="https://platform.openai.com/docs/models">OpenAI Docs - Models</a>
      </p>

      ---

      # Controlling Thinking: `reasoning_effort`

      ```python
      response = client.responses.create(
          model="gpt-5.5",
          reasoning={"effort": "high"},
          input="Find the bug in this concurrency code...",
      )
      ```

      --

      - __`low`__ — efficient reasoning when tool-use/planning still matters; latency-sensitive apps.

      --

      - __`medium`__ — the default: balanced quality, latency, and cost for most workflows.

      --

      - __`high`__ — complex agentic tasks, deep planning and debugging, when latency is less critical.

      --

      - __`xhigh`__ — hardest async tasks: deep research, frontier problem-solving — let it cook.

      --

      > ⚠️ Higher is not automatically better: with vague instructions, more effort can mean overthinking. Increase only when evals show gains.

      <p class="footnote">
        <sup>[5]</sup><a href="https://developers.openai.com/api/docs/guides/latest-model">OpenAI Docs - Using GPT-5.5</a>
      </p>

      ---

      # Hosted Tools: Batteries Included

      One parameter turns the model into an agent — OpenAI runs the tools for you:

      ```python
      response = client.responses.create(
          model="gpt-5.4-mini",
          tools=[{"type": "web_search"}],
          input="What changed in LangChain v1?",
      )
      ```

      --

      | Tool | What it does |
      |---|---|
      | `web_search` | Up-to-date answers from the web, with citations |
      | `file_search` | Semantic search over your uploaded files (hosted RAG) |
      | `code_interpreter` | Writes & runs Python in a sandbox (data analysis, math) |
      | `image_generation` | Generates / edits images inside the same conversation |
      | `computer_use` | Agentic control of a screen: clicks, typing, navigation |
      | `mcp` | Connect any remote MCP server as a tool source |

      <p class="footnote">
        <sup>[6]</sup><a href="https://platform.openai.com/docs/guides/tools">OpenAI Docs - Using tools</a>
      </p>

      # LangChain .accent[v1] + LangGraph

      ### What changed, in three lines

      ---

      # LangChain v1: What Changed

      - `create_agent` __replaces__ `create_react_agent` — one standard agent built on LangGraph.

      --

      - `system_prompt` __replaces__ the old `prompt` parameter — pass a plain string.

      --

      - Legacy chains (`LLMChain`, `RetrievalQA`, LCEL pipelines) moved to `langchain-classic` — the modern basics are __direct model calls + agents__.

      --

      ```python
      # the whole v1 mental model in 6 lines
      from langchain.agents import create_agent

      agent = create_agent(
          model="openai:gpt-5.4-mini",
          tools=[my_tool],
          system_prompt="You are a helpful assistant.",
      )
      ```

      # LangChain Building Blocks

      --

      ## Models

      --

      - One unified entry point for any provider: `init_chat_model`

      --

        ```python
        from langchain.chat_models import init_chat_model

        model = init_chat_model("openai:gpt-5.4-mini")

        output = model.invoke("I am teaching a live-training\
            about LLMs!")

        print(output.content)
        ```

      --

      - Swap `"openai:gpt-5.4-mini"` for `"anthropic:..."`, `"google_genai:..."` — same code.

      <p class="footnote">
        <sup>[9]</sup><a href="https://docs.langchain.com/oss/python/langchain/models">LangChain Docs - Models</a>
      </p>
      ---

      # LangChain Building Blocks

      --

      ## Messages

      --

      - Conversations are just lists of role + content — no special template language needed:

      --

        ```python
        response = model.invoke([
            {"role": "system",
             "content": "You are a concise teaching assistant."},
            {"role": "user",
             "content": "Explain embeddings in one sentence."},
        ])

        print(response.content)
        ```

      --

      - Need dynamic prompts? Plain Python f-strings work great:

        ```python
        question = f"Show me 5 examples of this concept: {concept}"
        ```

      <p class="footnote">
        <sup>[9]</sup><a href="https://docs.langchain.com/oss/python/langchain/messages">LangChain Docs - Messages</a>
      </p>

      ---

      # LangChain Building Blocks

      --

      ## Structured Output

      --

      - Get validated Python objects instead of raw strings:

      --

        ```python
        from pydantic import BaseModel, Field

        class Quiz(BaseModel):
            question: str
            options: list[str]
            answer: str = Field(description="The correct option")

        structured_model = model.with_structured_output(Quiz)

        quiz = structured_model.invoke(
            "Write a quiz question about transformers")

        quiz.answer   # plain attribute access, fully typed
        ```

      # Agents with `create_agent`

      --

      ## Agent = Model + Tools + System Prompt

      --

        ```python
        from langchain.agents import create_agent

        def get_weather(city: str) -> str:
            """Get the current weather for a city."""
            return f"It's always sunny in {city}!"

        agent = create_agent(
            model="openai:gpt-5.4-mini",
            tools=[get_weather],
            system_prompt="You are a helpful assistant.",
        )

        agent.invoke({"messages": [
            {"role": "user", "content": "Weather in SF?"}]})
        ```

      --

      - Runs on __LangGraph__ under the hood → persistence, streaming, human-in-the-loop for free.

      <p class="footnote">
        <sup>[10]</sup><a href="https://docs.langchain.com/oss/python/langchain/agents">LangChain Docs - Agents</a>

      # RAG the v1 Way: Retrieval as a Tool

      - Sample Code

      ```python
      from langchain_openai import OpenAIEmbeddings
      from langchain_chroma import Chroma
      from langchain_community.document_loaders import PyPDFLoader
      from langchain.agents import create_agent

      docs = PyPDFLoader("path-to-pdf.pdf").load_and_split()      # LOAD + SPLIT
      vectordb = Chroma.from_documents(
          docs, embedding=OpenAIEmbeddings())                     # EMBED + STORE

      def search_pdf(query: str) -> str:
          """Search the PDF for passages relevant to the query."""
          results = vectordb.similarity_search(query, k=3)        # RETRIEVE
          return "\n\n".join(doc.page_content for doc in results)

      agent = create_agent(
          model="openai:gpt-5.4-mini",
          tools=[search_pdf],
          system_prompt="Answer using the search_pdf tool.")

      agent.invoke({"messages": [{"role": "user",
          "content": "What is this paper about?"}]})              # ANSWER
      ```

      # Before You Ship: What's Deprecated in 2026

      | Deprecated | Status | Use instead |
      |---|---|---|
      | __Assistants API__ | Sunsets __Aug 26, 2026__ | Responses API + Conversations |
      | __Chat Completions__ | Legacy (still supported) | Responses API |
      | `initialize_agent` / `AgentExecutor` | __Removed__ in LangChain v1 | `create_agent` |
      | `create_react_agent` (langgraph.prebuilt) | Replaced | `create_agent` |
      | `LLMChain`, `RetrievalQA`, LCEL chains | Moved to `langchain-classic` | Direct `.invoke()` + agents |

      --

      > Rule of thumb: if a tutorial says `chat.completions`, `Assistants`, or `AgentExecutor` — it's from the past. 🦖

      # Migration Cheat Sheet: Old → New

      | You used to write... | Now write... |
      |---|---|
      | `client.chat.completions.create(...)` | `client.responses.create(...)` |
      | `messages=[{"role": "system", ...}]` | `instructions="..."` + `input="..."` |
      | `response.choices[0].message.content` | `response.output_text` |
      | `gpt-3.5-turbo` / `gpt-4` | `gpt-5.4-mini` (default), `gpt-5.5` (hard stuff) |
      | `ChatOpenAI(model=...)` | `init_chat_model("openai:gpt-5.4-mini")` |
      | LCEL pipe chains (`prompt`, `llm`, `parser`) | `model.invoke(...)` / `with_structured_output` |
      | `create_react_agent(llm, tools, prompt=...)` | `create_agent(model, tools, system_prompt=...)` |
      | `RetrievalQA.from_llm(...)` | retrieval function as a __tool__ + `create_agent` |
